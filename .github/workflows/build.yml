name: Build

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]

permissions:
    contents: read

jobs:
  # ──────────────────────────────────────────────
  # macOS — produce ShokzManager.app + .zip
  # ──────────────────────────────────────────────
  build-macos:
    runs-on: macos-15          # macOS Sequoia (Apple Silicon runner)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
          pip install -q pyinstaller

      - name: Download ffmpeg (macOS arm64)
        run: |
          mkdir -p resources/bin/macos
          curl -L "https://evermeet.cx/ffmpeg/getrelease/zip" -o /tmp/ffmpeg.zip
          unzip -o /tmp/ffmpeg.zip -d /tmp/ffmpeg_extracted
          cp /tmp/ffmpeg_extracted/ffmpeg resources/bin/macos/ffmpeg
          chmod +x resources/bin/macos/ffmpeg
          resources/bin/macos/ffmpeg -version | head -1

      - name: Build .app with PyInstaller
        run: pyinstaller build/pyinstaller_macos.spec --noconfirm --clean

      - name: Smoke test executable (macOS Sequoia)
        run: |
          dist/ShokzManager.app/Contents/MacOS/ShokzManager --version

      - name: Zip .app for upload
        run: |
          cd dist
          zip -r ShokzManager-macOS.zip ShokzManager.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShokzManager-macOS
          path: dist/ShokzManager-macOS.zip
          retention-days: 30

  # ──────────────────────────────────────────────
  # Windows — produce ShokzManager.exe
  # ──────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest    # Windows Server 2022 / Windows 11-compatible

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
          pip install -q pyinstaller

      - name: Download ffmpeg (Windows x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources\bin\windows | Out-Null
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\ffmpeg.zip"
          Expand-Archive -Path "$env:TEMP\ffmpeg.zip" -DestinationPath "$env:TEMP\ffmpeg_extracted" -Force
          $ffmpegExe = Get-ChildItem -Path "$env:TEMP\ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination "resources\bin\windows\ffmpeg.exe"
          .\resources\bin\windows\ffmpeg.exe -version

      - name: Build .exe with PyInstaller
        run: pyinstaller build\pyinstaller_windows.spec --noconfirm --clean

      - name: Smoke test executable (Windows 11-compatible)
        shell: pwsh
        run: |
          .\dist\ShokzManager.exe --version
          if ($LASTEXITCODE -ne 0) { throw "ShokzManager.exe smoke test failed" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShokzManager-Windows
          path: dist\ShokzManager.exe
          retention-days: 30

  # ──────────────────────────────────────────────
  # Release — sólo cuando se hace push de un tag v*
  # ──────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ShokzManager-macOS
          path: dist/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ShokzManager-Windows
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ShokzManager-macOS.zip
            dist/ShokzManager.exe
          generate_release_notes: true
